<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>UGT Dashboard | النظام المتكامل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root{--bg:#0a1020;--ink:#eef3ff;--mu:#9fb0cc;--ln:rgba(255,255,255,.09);--hd:rgba(255,255,255,.05);--h1:#fff;--h1b:#fff;--sub:#f4b740;--btn:#f4b740;--btnt:#1b1400}
body{background:radial-gradient(900px 420px at 85% -5%,rgba(99,102,241,.28),transparent 65%),radial-gradient(700px 400px at 5% 105%,rgba(14,165,233,.2),transparent 65%),var(--bg);background-attachment:fixed}
.hd{backdrop-filter:blur(12px)}
.ver{color:#9fb0cc}
.card{position:relative;overflow:hidden;border-radius:20px;padding:22px 10px 18px;min-height:156px;justify-content:center;color:#fff;background:linear-gradient(145deg,var(--a),var(--b));box-shadow:0 12px 24px -14px var(--b)}
.card:before{content:"";position:absolute;top:-40%;right:-30%;width:90%;height:90%;border-radius:50%;background:rgba(255,255,255,.14)}
.card .ic{position:relative;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:23px;background:rgba(255,255,255,.2);color:#fff;margin-bottom:13px;backdrop-filter:blur(2px)}
.card b{position:relative;font-size:14.5px}
.card small{position:relative;font-size:12px;color:rgba(255,255,255,.82);margin-top:3px;font-weight:500}
.card:hover{transform:translateY(-6px) scale(1.02);box-shadow:0 20px 34px -12px var(--b)}
.card:nth-child(1){--a:#6366f1;--b:#8b5cf6}.card:nth-child(2){--a:#0ea5e9;--b:#2563eb}.card:nth-child(3){--a:#14b8a6;--b:#0891b2}
.card:nth-child(4){--a:#f97316;--b:#ef4444}.card:nth-child(5){--a:#f59e0b;--b:#ea580c}.card:nth-child(6){--a:#ec4899;--b:#e11d48}
.card:nth-child(7){--a:#8b5cf6;--b:#6366f1}.card:nth-child(8){--a:#38bdf8;--b:#6366f1}.card:nth-child(9){--a:#22c55e;--b:#0d9488}
.card:nth-child(10){--a:#3b82f6;--b:#1d4ed8}.card:nth-child(11){--a:#a855f7;--b:#ec4899}.card:nth-child(12){--a:#10b981;--b:#059669}
.card:nth-child(13){--a:#06b6d4;--b:#3b82f6}.card:nth-child(14){--a:#eab308;--b:#f59e0b}
.note{background:var(--hd);border:1px solid var(--ln);border-right:5px solid #f4b740;border-radius:18px;padding:18px 20px;backdrop-filter:blur(8px)}
.ni{background:rgba(244,183,64,.16);color:#f4b740}
.frame{border-color:var(--ln)}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;min-height:100vh;color:var(--ink);background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding:22px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:14px 22px;border-radius:20px;background:var(--hd);border:1px solid var(--ln);margin-bottom:26px}
.lg{display:flex;align-items:center;gap:14px}
.lg img{width:50px;height:50px;border-radius:14px;background:#fff;padding:6px;object-fit:contain;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.lg h1{font-size:20px;font-weight:800;color:var(--h1);line-height:1.3}
.lg p{font-size:12.5px;font-weight:600;color:var(--sub);margin-top:1px}
.ac{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:8px;height:42px;padding:0 20px;border-radius:12px;border:0;cursor:pointer;font:700 14px 'Cairo',sans-serif;background:var(--btn);color:var(--btnt);transition:.2s}
.back:hover{filter:brightness(1.1);transform:translateY(-1px)}
.ver{font-size:12px;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:7px;padding:0 6px}
.ver i{color:#f4b740}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:14px}
.card{display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;text-decoration:none;transition:transform .22s,box-shadow .22s,border-color .22s}
.card b{font-weight:800;line-height:1.45}
.card:focus-visible{outline:3px solid #f4b740;outline-offset:3px}
.sec{margin-top:34px}
.sec h2{font-size:18px;font-weight:800;margin-bottom:14px;color:var(--h1b);display:flex;align-items:center;gap:10px}
.sec h2:before{content:"";width:5px;height:22px;border-radius:5px;background:#f4b740}
.notes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.note{display:flex;gap:14px;align-items:flex-start}
.note:first-child{grid-column:1/-1}
.ni{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;font-size:17px}
.note strong{display:block;font-size:15px;margin-bottom:4px}
.note p{font-size:13.5px;line-height:1.8;color:var(--mu)}
.frame{width:100%;height:calc(100vh - 150px);min-height:520px;border:1px solid var(--ln);border-radius:18px;background:#fff}
@media(max-width:1180px){.grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:760px){.wrap{padding:12px}.grid{grid-template-columns:repeat(2,1fr);gap:10px}.notes{grid-template-columns:1fr}.hd{padding:12px 16px}.lg h1{font-size:17px}.back{padding:0 14px;font-size:13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hd">
    <div class="lg">
      <img src="https://unionaire.com/ct/unionaire.png" alt="UGT" onerror="this.src='https://via.placeholder.com/60?text=UGT'">
      <div><h1>UGT Call Center Dashboard</h1><p>منصة الخدمات المتكاملة | أداء احترافي</p></div>
    </div>
    <div class="ac">
      <span class="ver"><i class="fas fa-chart-line"></i> الإصدار الاحترافي-Awad shihata v4</span>
      <button class="back" id="backToHomeBtn"><i class="fas fa-home"></i> العودة للقائمة الرئيسية</button>
    </div>
  </header>
  <main id="dynamicContent"></main>
</div>
<template id="homeTpl">
  <div class="grid">
<a class="card" data-page="sms.html" role="button" tabindex="0"><span class="ic"><i class="fas fa-comment-dots"></i></span><b>SMS</b><small>إرسال رسائل</small></a>
<a class="card" data-page="model-serial.html" role="button" tabindex="0"><span class="ic"><i class="fas fa-barcode"></i></span><b>الموديل والسريال</b><small>بحث متقدم</small></a>
<a class="card" data-page="visit-fees.html" role="button" tabindex="0"><span class="ic"><i class="fas fa-money-bill-wave"></i></span><b>رسوم الزيارة</b><small>الأسعار والتكاليف</small></a>
<a class="card" data-page="faults.html" role="button" tabindex="0"><span class="ic"><i class="fas fa-exclamation-triangle"></i></span><b>اختيار الأعطال</b><small>تشخيص دقيق</small></a>
<a class="card" data-page="electric-heater.html" role="button" tabindex="0"><span class="ic"><i class="fas fa-fire"></i></span><b>سخان كهرباء</b><small>استبدال وإصلاح</small></a>
<a class="card" data-page="misuse.html" role="button" tabindex="0"><span class="ic"><i class="fas fa-ban"></i></span><b>سوء الاستخدام</b><small>سياسات الضمان</small></a>
<a class="card" data-page="Hande -UNsales-compalin.html" role="button" tabindex="0"><span class="ic"><i class="fas fa-clipboard-list"></i></span><b>Handling &amp; UN Sales</b><small>متابعة الشكاوى</small></a>
<a class="card" data-page="fridges.html" role="button" tabindex="0"><span class="ic"><i class="fas fa-snowflake"></i></span><b>حجز الثلاجات</b><small>Troubleshooting</small></a>
<a class="card" data-page="spare-parts.html" role="button" tabindex="0"><span class="ic"><i class="fas fa-cogs"></i></span><b>فروع قطع الغيار</b><small>توفير القطع</small></a>
<a class="card" data-page="service-centers.html" role="button" tabindex="0"><span class="ic"><i class="fas fa-building"></i></span><b>مراكز الخدمة</b><small>المعتمدة</small></a>
<a class="card" data-page="3cx-odoo.html" role="button" tabindex="0"><span class="ic"><i class="fas fa-headset"></i></span><b>3CX &amp; Odoo</b><small>روابط النظام</small></a>
<a class="card" data-page="whatsapp-scripts.html" role="button" tabindex="0"><span class="ic"><i class="fab fa-whatsapp"></i></span><b>WhatsApp Scripts</b><small>نصوص جاهزة</small></a>
<a class="card" data-page="unionair-script.html" role="button" tabindex="0"><span class="ic"><i class="fas fa-phone-volume"></i></span><b>Call-script Unionaire</b><small>سكريبت المكالمات</small></a>
<a class="card" data-page="employee-guidelines.html" role="button" tabindex="0"><span class="ic"><i class="fas fa-info-circle"></i></span><b>تعليمات هامة للكول سنتر</b><small>إرشادات الموظفين</small></a>
  </div>
  <section class="sec"><h2>توجيهات وإرشادات للموظفين</h2>
    <div class="notes">
<div class="note"><span class="ni"><i class="fas fa-exclamation-triangle"></i></span><div><strong>مشاكل الشيكات والرصيد</strong><p>شيك غير مطابق أو إمضاء: يتم إبلاغ العميل بالتواصل مع الفرع الرئيسي (18757) لدعم الشيك. • لا يوجد رصيد: يعني حد السحب اليومي انتهى، يُفضل التوجه في اليوم التالي باكراً أو إيداع الشيك بحساب العميل.</p></div></div>
<div class="note"><span class="ni"><i class="fas fa-snowflake"></i></span><div><strong>أرفف الثلاجات (مستندات 400 أو 420)</strong><p>يأتي معها رف واحد للفريزر + رفين في الكابينة. إذا رغب العميل في الشراء: 350جنيه رسوم + 250 جنيه ثمن الرف، أو الشراء من منافذ قطع غيار UGT.</p></div></div>
<div class="note"><span class="ni"><i class="fas fa-tools"></i></span><div><strong>كابولي التكييف</strong><p>سعره 870 جنيهاً ولا يشمل التركيب. أسعار التركيب لا تشمل الكابولي.</p></div></div>
<div class="note"><span class="ni"><i class="fas fa-soap"></i></span><div><strong>غسيل التكييف بالماكينة</strong><p>يتم تحصيل 650 جنيهاً + فرق المسافة حسب المحافظة.</p></div></div>
    </div>
  </section>
</template>
<script>
const urls={"sms.html":"sms.html","model-serial.html":"model-serial.html","visit-fees.html":"visit-fees.html","faults.html":"faults.html","electric-heater.html":"electric-heater.html","misuse.html":"misuse.html","Hande -UNsales-compalin.html":"Hande -UNsales-compalin.html","fridges.html":"fridges.html","spare-parts.html":"spare-parts.html","service-centers.html":"service-centers.html","3cx-odoo.html":"3cx-odoo.html","whatsapp-scripts.html":"whatsapp-scripts.html","unionair-script.html":"unionair-script.html","employee-guidelines.html":"employee-guidelines.html"};
const content=document.getElementById('dynamicContent');
const home=document.getElementById('homeTpl').innerHTML;
function loadPage(id){
  window.scrollTo(0,0);
  if(id==='main'||!urls[id]){content.innerHTML=home;bind();return;}
  content.innerHTML='<iframe src="'+urls[id]+'" class="frame" title="'+urls[id]+'"></iframe>';
}
function bind(){
  document.querySelectorAll('.card').forEach(c=>{
    const go=()=>{const t=c.getAttribute('data-page');if(urls[t])loadPage(t);else alert('الصفحة غير متوفرة حالياً');};
    c.addEventListener('click',go);
    c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});
  });
}
document.getElementById('backToHomeBtn').addEventListener('click',()=>loadPage('main'));
loadPage('main');
</script>
</body>
</html>
