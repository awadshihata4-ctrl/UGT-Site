<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام اختيار الأعطال الذكي</title>
<!-- استدعاء خط Tajawal وأيقونات FontAwesome لمظهر احترافي -->
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
    --primary-color: #2563eb;
    --primary-hover: #1d4ed8;
    --secondary-color: #10b981;
    --secondary-hover: #059669;
    --bg-gradient: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
    --card-bg: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Tajawal', sans-serif;
  }

  body {
    background: var(--bg-gradient);
    color: var(--text-main);
    min-height: 100vh;
    padding: 40px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .container {
    width: 100%;
    max-width: 650px;
    background: var(--card-bg);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    transition: all 0.3s ease;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 25px;
    color: #0f172a;
    text-align: center;
  }

  h2 {
    font-size: 20px;
    color: var(--text-muted);
    margin-bottom: 20px;
    text-align: center;
  }

  /* أزرار التحكم والرجوع */
  .header-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  .back-btn {
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    background: #fff;
    color: var(--text-main);
    transition: 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .back-btn:hover {
    background: #f8fafc;
    border-color: #94a3b8;
  }

  /* أزرار اختيار النوع والمنتجات */
  .grid-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 10px;
  }

  @media (max-width: 480px) {
    .grid-container {
      grid-template-columns: 1fr;
    }
  }

  .main-btn, .product-btn {
    padding: 20px;
    font-size: 18px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    background: var(--primary-color);
    color: #fff;
    transition: all 0.2s ease;
    box-shadow: 0 4px 6px rgba(37, 99, 235, 0.1);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .main-btn:hover, .product-btn:hover {
    background: var(--primary-hover);
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(37, 99, 235, 0.15);
  }

  /* شريط البحث */
  .search-wrapper {
    position: relative;
    margin-bottom: 20px;
  }

  .search-input {
    width: 100%;
    padding: 12px 40px 12px 15px;
    font-size: 16px;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    outline: none;
    transition: 0.2s;
  }

  .search-input:focus {
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
  }

  .search-wrapper i {
    position: absolute;
    top: 50%;
    right: 15px;
    transform: translateY(-50%);
    color: var(--text-muted);
  }

  /* كروت الأعطال */
  .faults-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 450px;
    overflow-y: auto;
    padding-left: 5px;
  }

  /* تخصيص شريط التمرير */
  .faults-list::-webkit-scrollbar {
    width: 6px;
  }
  .faults-list::-webkit-scrollbar-thumb {
    background-color: #cbd5e1;
    border-radius: 4px;
  }

  .card {
    background: #f8fafc;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    transition: 0.2s;
  }

  .card:hover {
    background: #f1f5f9;
    border-color: #cbd5e1;
  }

  .card span {
    font-size: 16px;
    font-weight: 500;
    text-align: right;
    line-height: 1.5;
  }

  button.copyBtn {
    padding: 8px 16px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    background: var(--secondary-color);
    color: #fff;
    border: none;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: 0.2s;
    white-space: nowrap;
  }

  button.copyBtn:hover {
    background: var(--secondary-hover);
  }

  /* التنبيه المنبثق الناعم (Toast) */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #1e293b;
    color: #fff;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
    opacity: 0;
    z-index: 1000;
    pointer-events: none;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
</style>
</head>

<div class="container">
  
  <!-- الصفحة الرئيسية -->
  <div id="mainPage">

    <h2>الرجاء اختيار الفئة للبدء:</h2>
    <div class="grid-container">
      <button class="main-btn" onclick="selectType('عميل')">

      <button class="main-btn" onclick="selectType('معرض')">
        <i class="fa-solid fa-store fa-2x"></i>
        <span>قسم المعارض / التجار</span>

    </div>
  </div>

  <!-- صفحة المنتجات -->
  <div id="productsPage" style="display:none;">
    <div class="header-actions">

    </div>
    <h2>اختر المنتج المطلوب:</h2>

  </div>

  <!-- صفحة الأعطال -->

    </div>

</div>

const mainPage = document.getElementById('mainPage');
const productsPage = document.getElementById('productsPage');
const faultsPage = document.getElementById('faultsPage');
const productsContainer = document.getElementById('productsContainer');
const faultsContainer = document.getElementById('faultsContainer');
const typeTitle = document.getElementById('typeTitle');
const productTitle = document.getElementById('productTitle');
const searchInput = document.getElementById('searchInput');

let selectedType = '';
let selectedProduct = '';
let currentFaults = []; // لتخزين الأعطال الحالية النشطة لتسهيل البحث فيها

function selectType(type) {
  selectedType = type;
  mainPage.style.display = 'none';
  productsPage.style.display = 'block';
  typeTitle.innerHTML = type === 'عميل' ? '<i class="fa-solid fa-user-tie"></i> قسم العملاء' : '<i class="fa-solid fa-store"></i> قسم المعارض';

  const products = [...new Set(allFaultsData.filter(f=>f.type===type).map(f=>f.product))];
  productsContainer.innerHTML = '';
  products.forEach(p=>{
    const btn = document.createElement('button');
    btn.className = 'product-btn';
    btn.innerHTML = `<i class="fa-solid fa-layer-group"></i> <span>${p}</span>`;
    btn.onclick = ()=>selectProduct(p);
    productsContainer.appendChild(btn);
  });
}

function selectProduct(product) {
  selectedProduct = product;
  productsPage.style.display = 'none';
  faultsPage.style.display = 'block';
  productTitle.innerHTML = `<i class="fa-solid fa-screwdriver-wrench"></i> أعطال: ${product}`;
  searchInput.value = ''; // تصفية حقل البحث عند دخول صفحة جديدة

  currentFaults = allFaultsData.filter(f=>f.type===selectedType && f.product===product);
  renderFaults(currentFaults);
}

// دالة لبناء الكروت وتحديثها
function renderFaults(faultsArray) {
  faultsContainer.innerHTML = '';
  if(faultsArray.length === 0) {
    faultsContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted); padding:20px;">لا توجد أعطال مطابقة للبحث.</div>';
    return;
  }
  faultsArray.forEach(f=>{
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<span>${f.fault}</span><button class="copyBtn" onclick="copyText('${f.fault}')"><i class="fa-regular fa-copy"></i> نسخ</button>`;
    faultsContainer.appendChild(card);
  });
}

// دالة الفلترة الفورية أثناء الكتابة في البحث
function filterFaults() {
  const query = searchInput.value.toLowerCase().trim();
  const filtered = currentFaults.filter(f => f.fault.toLowerCase().includes(query));
  renderFaults(filtered);
}

function goBackToMain() {
  productsPage.style.display = 'none';
  mainPage.style.display = 'block';
}

function goBackToProducts() {
  faultsPage.style.display = 'none';
  productsPage.style.display = 'block';
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast();
  }).catch(err => {
    console.error('خطأ في النسخ: ', err);
  });
}

// دالة إظهار التنبيه الاحترافي
function showToast() {
  const toast = document.getElementById('toast');
  toast.addClassList = toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 2500);
}
