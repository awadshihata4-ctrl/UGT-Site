<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام إرسال رسائل للعملاء</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { background: #1e293b; border: 1px solid #334155; padding: 15px 25px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 10px; }
        header h1 { font-size: 20px; color: #fff; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        header button { color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 14px; border: none; cursor: pointer; font-family: 'Cairo', sans-serif; }
        header .export-btn { background: #10b981; }
        header .delete-btn { background: #ef4444; }
        header .delete-btn:hover { background: #dc2626; }
        .title-section { text-align: center; margin-bottom: 25px; }
        .title-section h2 { font-size: 26px; color: #fff; margin-bottom: 5px; }
        .title-section p { color: #94a3b8; font-size: 14px; }
        .form-box { background: #1e293b; border: 1px solid #334155; border-radius: 18px; padding: 30px; }
        .form-header { display: flex; align-items: center; gap: 12px; padding-bottom: 20px; margin-bottom: 25px; border-bottom: 1px solid #334155; }
        .form-header .icon-box { width: 45px; height: 45px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgba(99,102,241,0.2); color: #818cf8; }
        .form-header h3 { font-size: 19px; color: #fff; }
        .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .field label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 600; }
        .field input, .field select { width: 100%; background: #0f172a; border: 1px solid #334155; color: #e2e8f0; padding: 12px 15px; border-radius: 10px; font-family: 'Cairo', sans-serif; font-size: 14px; }
        .field input:focus, .field select:focus { outline: none; border-color: #6366f1; }
        .field select { cursor: pointer; }
        .field input.invalid { border-color: #ef4444; background: rgba(239,68,68,0.05); }
        .field input.valid { border-color: #10b981; }
        .field .hint { display: block; font-size: 11px; color: #64748b; margin-top: 4px; }
        .field .hint.error { color: #ef4444; }
        .field .hint.success { color: #10b981; }
        .submit-btn { width: 100%; margin-top: 25px; padding: 15px; background: linear-gradient(135deg, #6366f1, #a855f7); color: #fff; border: none; border-radius: 12px; font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer; }
        .submit-btn:disabled { opacity: 0.5; cursor: wait; }
        .toast { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); padding: 15px 25px; border-radius: 12px; color: #fff; font-weight: 600; z-index: 999; }
        .toast.success { background: #10b981; }
        .toast.error { background: #ef4444; }
        .log-section { background: #1e293b; border: 1px solid #334155; border-radius: 18px; padding: 25px; margin-top: 25px; }
        .log-section h3 { color: #fff; font-size: 18px; margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
        .log-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .log-table th { background: #0f172a; color: #94a3b8; padding: 12px 10px; text-align: right; font-weight: 600; border-bottom: 2px solid #334155; }
        .log-table td { padding: 12px 10px; border-bottom: 1px solid #334155; color: #e2e8f0; }
        .log-table tr:hover td { background: rgba(99,102,241,0.05); }
        .log-table .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; display: inline-block; }
        .badge-booking { background: rgba(16,185,129,0.15); color: #10b981; }
        .badge-fridge { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .empty-log { text-align: center; color: #64748b; padding: 30px; font-size: 14px; }
        @media (max-width: 700px) {
            .fields-grid { grid-template-columns: 1fr; }
            .log-section { overflow-x: auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div><h1>💬 نظام إرسال رسائل للعملاء</h1></div>
        <div class="header-actions">
            <button class="export-btn" onclick="exportExcel()">📊 تصدير Excel</button>
            <button class="delete-btn" onclick="deleteAllData()">🗑️ مسح كل البيانات</button>
        </div>
    </header>

    <div class="title-section">
        <h2>تسجيل عملية إرسال جديدة</h2>
        <p>سجّل رقم العميل واختر نوع الرسالة</p>
    </div>

    <div class="form-box">
        <div class="form-header">
            <div class="icon-box">📝</div>
            <h3>بيانات العملية</h3>
        </div>

        <div class="fields-grid">
            <div class="field">
                <label>رقم موبايل العميل *</label>
                <input type="tel" id="customer_phone" placeholder="01xxxxxxxxx"
                       maxlength="11" inputmode="numeric" pattern="[0-9]{11}"
                       oninput="validatePhone(this, 'phoneHint')">
                <small class="hint" id="phoneHint">11 رقم بالظبط (مثال: 01012345678)</small>
            </div>

            <div class="field">
                <label>نوع الرسالة *</label>
                <select id="action_type">
                    <option value="">-- اختر نوع الرسالة --</option>
                    <option value="إرسال لينك الحجز">إرسال لينك الحجز</option>
                    <option value="إرسال شرح وتشغيل الثلاجة">إرسال شرح وتشغيل الثلاجة</option>
                </select>
            </div>

            <div class="field">
                <label>التاريخ</label>
                <input type="text" id="display_date" readonly style="opacity:0.7; cursor:not-allowed;">
            </div>
            <div class="field">
                <label>الساعة</label>
                <input type="text" id="display_time" readonly style="opacity:0.7; cursor:not-allowed;">
            </div>
        </div>

        <button type="button" class="submit-btn" id="submitBtn" onclick="saveData()">💾 حفظ العملية</button>
    </div>

    <div class="log-section">
        <h3>📋 سجل العمليات <span id="logCount" style="color:#64748b; font-size:14px;"></span></h3>
        <div id="logContainer">
            <div class="empty-log">جاري التحميل...</div>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://blzgyachpejzlfrlpuqv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJsemd5YWNocGVqemxmcmxwdXF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NjYyODEsImV4cCI6MjEwNzU0MjI4MX0.gZckJ1SGhgtSosZTDSd5W6K4ILy4XRKXdv_zYKJv3L4';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ADMIN_PASSWORD = '19012';

    function updateDateTime() {
        const now = new Date();
        const dateStr = now.toLocaleDateString('ar-EG', {
            year: 'numeric', month: '2-digit', day: '2-digit'
        });
        const timeStr = now.toLocaleTimeString('ar-EG', {
            hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
        });
        document.getElementById('display_date').value = dateStr;
        document.getElementById('display_time').value = timeStr;
    }
    setInterval(updateDateTime, 1000);
    updateDateTime();

    function validatePhone(input, hintId) {
        const hintEl = document.getElementById(hintId);
        const value = input.value.trim();
        const cleaned = value.replace(/[^\d٠-٩]/g, '');
        if (cleaned !== value) input.value = cleaned;

        if (cleaned === '') {
            input.classList.remove('invalid', 'valid');
            hintEl.classList.remove('error', 'success');
            hintEl.textContent = '11 رقم بالظبط (مثال: 01012345678)';
            return false;
        }
        if (/[٠-٩]/.test(cleaned)) {
            input.classList.add('invalid'); input.classList.remove('valid');
            hintEl.classList.add('error'); hintEl.classList.remove('success');
            hintEl.textContent = '❌ من فضلك اكتب الأرقام بالإنجليزية (0-9)';
            return false;
        }
        if (cleaned.length !== 11) {
            input.classList.add('invalid'); input.classList.remove('valid');
            hintEl.classList.add('error'); hintEl.classList.remove('success');
            hintEl.textContent = '❌ لازم 11 رقم — انت كتبت ' + cleaned.length + ' رقم';
            return false;
        }
        input.classList.remove('invalid'); input.classList.add('valid');
        hintEl.classList.remove('error'); hintEl.classList.add('success');
        hintEl.textContent = '✅ رقم صحيح';
        return true;
    }

    function isValidPhone(value) {
        return /^\d{11}$/.test((value || '').trim());
    }

    function showToast(msg, type) {
        if (!type) type = 'success';
        const t = document.createElement('div');
        t.className = 'toast ' + type;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(function() { t.remove(); }, 3000);
    }

    async function saveData() {
        const phone = document.getElementById('customer_phone').value.trim();
        const actionType = document.getElementById('action_type').value;

        if (!phone) {
            showToast('رقم الموبايل مطلوب', 'error');
            document.getElementById('customer_phone').focus();
            return;
        }
        if (!isValidPhone(phone)) {
            showToast('❌ رقم الموبايل لازم 11 رقم بالظبط', 'error');
            document.getElementById('customer_phone').focus();
            return;
        }
        if (!actionType) {
            showToast('❌ اختر نوع الرسالة', 'error');
            document.getElementById('action_type').focus();
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = '⏳ جاري الحفظ...';

        const now = new Date();
        const data = {
            customer_phone: phone,
            action_type: actionType,
            created_at: now.toISOString(),
            date_display: now.toLocaleDateString('ar-EG', { year: 'numeric', month: '2-digit', day: '2-digit' }),
            time_display: now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true })
        };

        const result = await supabaseClient.from('calls_log').insert([data]);
        const error = result.error;

        btn.disabled = false;
        btn.textContent = '💾 حفظ العملية';

        if (error) {
            console.error(error);
            showToast('خطأ: ' + error.message, 'error');
        } else {
            showToast('✅ تم الحفظ بنجاح', 'success');
            document.getElementById('customer_phone').value = '';
            document.getElementById('action_type').value = '';
            document.getElementById('customer_phone').classList.remove('valid', 'invalid');
            document.getElementById('phoneHint').textContent = '11 رقم بالظبط (مثال: 01012345678)';
            document.getElementById('phoneHint').classList.remove('error', 'success');
            loadLog();
        }
    }

    async function loadLog() {
        const container = document.getElementById('logContainer');
        const { data, error } = await supabaseClient
            .from('calls_log')
            .select('*')
            .order('created_at', { ascending: false })
            .limit(50);

        if (error) {
            container.innerHTML = '<div class="empty-log">❌ خطأ في تحميل السجل: ' + error.message + '</div>';
            return;
        }

        if (!data || data.length === 0) {
            container.innerHTML = '<div class="empty-log">لا توجد عمليات مسجلة بعد</div>';
            document.getElementById('logCount').textContent = '';
            return;
        }

        document.getElementById('logCount').textContent = '(' + data.length + ')';

        let html = '<table class="log-table"><thead><tr>';
        html += '<th>#</th><th>رقم الموبايل</th><th>نوع الرسالة</th><th>التاريخ</th><th>الساعة</th>';
        html += '</tr></thead><tbody>';

        data.forEach(function(row, idx) {
            const badgeClass = row.action_type === 'إرسال لينك الحجز' ? 'badge-booking' : 'badge-fridge';
            html += '<tr>';
            html += '<td>' + (idx + 1) + '</td>';
            html += '<td dir="ltr" style="text-align:right;">' + escapeHtml(row.customer_phone || '') + '</td>';
            html += '<td><span class="badge ' + badgeClass + '">' + escapeHtml(row.action_type || '') + '</span></td>';
            html += '<td>' + escapeHtml(row.date_display || '') + '</td>';
            html += '<td>' + escapeHtml(row.time_display || '') + '</td>';
            html += '</tr>';
        });

        html += '</tbody></table>';
        container.innerHTML = html;
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function(c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    async function exportExcel() {
        const password = prompt('🔒 أدخل كلمة المرور لتصدير Excel:');
        if (password === null) return;
        if (password !== ADMIN_PASSWORD) {
            showToast('❌ كلمة المرور غير صحيحة', 'error');
            return;
        }

        showToast('⏳ جاري تجهيز الملف...', 'success');

        const { data, error } = await supabaseClient
            .from('calls_log')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            showToast('خطأ: ' + error.message, 'error');
            return;
        }

        if (!data || data.length === 0) {
            showToast('لا توجد بيانات للتصدير', 'error');
            return;
        }

        const rows = data.map(function(row, idx) {
            return {
                'م': idx + 1,
                'رقم الموبايل': row.customer_phone || '',
                'نوع الرسالة': row.action_type || '',
                'التاريخ': row.date_display || '',
                'الساعة': row.time_display || ''
            };
        });

        const ws = XLSX.utils.json_to_sheet(rows);
        ws['!cols'] = [
            { wch: 6 }, { wch: 16 }, { wch: 28 }, { wch: 14 }, { wch: 14 }
        ];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'سجل الرسائل');

        const now = new Date();
        const fileName = 'سجل_الرسائل_' + now.getFullYear() + '-' +
            String(now.getMonth() + 1).padStart(2, '0') + '-' +
            String(now.getDate()).padStart(2, '0') + '.xlsx';

        XLSX.writeFile(wb, fileName);
        showToast('✅ تم تصدير الملف بنجاح', 'success');
    }

    /* =========================================================
       🗑️ مسح كل البيانات
       ========================================================= */
    async function deleteAllData() {
        // 1) طلب كلمة المرور
        const password = prompt('🔒 أدخل كلمة المرور لمسح كل البيانات:');
        if (password === null) return;
        if (password !== ADMIN_PASSWORD) {
            showToast('❌ كلمة المرور غير صحيحة', 'error');
            return;
        }

        // 2) تأكيد نهائي قبل المسح
        const confirm1 = confirm('⚠️ تحذير!\n\nهتحذف كل العمليات المسجلة نهائيًا!\n\nهل أنت متأكد؟');
        if (!confirm1) return;

        const confirm2 = confirm('⚠️ تأكيد أخير!\n\nمفيش رجوع بعد كده!\n\nاضغط OK للمسح النهائي.');
        if (!confirm2) return;

        showToast('⏳ جاري المسح...', 'success');

        // 3) مسح كل الصفوف — لازم id > 0 (أي id موجود)
        const { error } = await supabaseClient
            .from('calls_log')
            .delete()
            .gt('id', 0);

        if (error) {
            console.error(error);
            showToast('❌ خطأ: ' + error.message, 'error');
            return;
        }

        showToast('✅ تم مسح كل البيانات بنجاح', 'success');

        // 4) تحديث السجل
        loadLog();
    }

    document.addEventListener('DOMContentLoaded', function() {
        loadLog();
    });
</script>
</body>
</html>
