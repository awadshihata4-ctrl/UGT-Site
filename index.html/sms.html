<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UGT Booking | يونيون اير</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap">
<style>
  :root{
    --blue:#0b4f9c; --blue-dark:#083a73; --blue-light:#e8f1fb;
    --accent:#19a7ce; --green:#1f9d63; --red:#d64545;
    --bg:#f3f6fb; --card:#ffffff; --text:#1c2a3a; --muted:#6b7a8c; --border:#dde5ef;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Almarai',Tahoma,sans-serif;background:linear-gradient(135deg,#0b4f9c 0%,#19a7ce 50%,#1f9d63 100%) fixed;min-height:100vh;color:var(--text);direction:rtl}

  .topbar{background:transparent;color:#fff;padding:26px 24px 6px;text-align:center}
  .topbar-inner{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap}
  .topbar-inner > div:last-child{text-align:center}
  .topbar h1{text-shadow:0 2px 8px rgba(0,0,0,.2)}
  .logo-wrap{background:#fff;border-radius:16px;padding:8px 14px;display:flex;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  .logo-wrap img{height:56px;width:auto;display:block}
  .topbar h1{margin:0;font-size:22px;font-weight:800}
  .topbar p{margin:4px 0 0;font-size:13px;opacity:.9;font-weight:400}

  .wrap{max-width:1180px;margin:24px auto;padding:0 16px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .wrap > section:last-child{position:sticky;top:16px;align-self:start}
  @media(max-width:860px){.wrap{grid-template-columns:1fr}.wrap > section:last-child{position:static}}

  .card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:0 6px 20px rgba(20,50,90,.06)}
  .card h2{margin:0 0 16px;font-size:17px;font-weight:800;color:var(--blue-dark)}

  .tabs{display:flex;gap:8px;background:var(--blue-light);padding:6px;border-radius:14px;margin-bottom:20px}
  .tab{flex:1;border:0;background:transparent;font-family:inherit;font-weight:800;font-size:14px;padding:12px 8px;border-radius:10px;cursor:pointer;color:var(--blue);transition:.2s}
  .tab.active{background:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(11,79,156,.35)}

  .btn{font-family:inherit;font-weight:800;font-size:14px;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;color:#fff;transition:.15s}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.07)}
  .btn-primary{background:var(--blue)} .btn-danger{background:var(--red)} .btn-success{background:var(--green)}
  .btn-block{width:100%;padding:14px;font-size:15px}
  .actions{display:flex;gap:10px;margin-bottom:18px}

  .form-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;background:#f8fafd;border:1px solid var(--border);border-radius:12px}
  .form-group label{background:var(--blue);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;margin:0}
  .zerial-input{font-family:inherit;font-size:15px;width:220px;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:10px;direction:ltr;text-align:left;outline:none;color:var(--text);background:#fff}
  .zerial-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(25,167,206,.2)}
  .issue-date{margin:0;font-size:12px;color:var(--muted)}

  #customerDetails{display:none;margin-top:16px;padding:14px;border:1px dashed var(--accent);border-radius:12px;background:#f2fbfe}
  #customerDetails div{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
  #customerDetails input{flex:1;border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-family:inherit;background:#fff}

  .maint-info{display:none;background:var(--blue-light);border-radius:14px;padding:16px;font-size:14px;line-height:1.9;color:var(--blue-dark);margin-top:18px}
  .maint-info ul{margin:8px 0 0;padding-right:20px}

  #copyTextBox{width:100%;min-height:380px;resize:vertical;padding:16px;border:1px solid var(--border);border-radius:14px;background:#f8fafd;font-family:inherit;font-size:14px;line-height:1.9;color:var(--text);outline:none;margin-bottom:14px;direction:rtl;text-align:right}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--green);color:#fff;padding:12px 24px;border-radius:30px;font-weight:800;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 6px 20px rgba(0,0,0,.2)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{text-align:center;color:rgba(255,255,255,.9);font-size:12px;padding:10px 0 60px}
  .signature{position:fixed;bottom:14px;left:16px;direction:ltr;background:rgba(255,255,255,.95);color:var(--blue-dark);font-weight:800;font-size:12px;padding:8px 16px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.2);z-index:50;letter-spacing:.3px}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo-wrap"><img src="https://unionaire.com/ct/unionaire.png" alt="Unionaire"></div>
    <div>
      <h1>مركز رسائل خدمة العملاء</h1>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="card">
    <div class="tabs">
      <button type="button" class="tab active" data-mode="serial">🔗 رابط الحجز بالسيريال</button>
      <button type="button" class="tab" data-mode="maint">🛠️ حجز بلاغ صيانة &amp; واتساب</button>
    </div>

    <h2>📋 السيريال</h2>
    <div class="actions">
      <button type="button" id="addBtn" class="btn btn-primary">➕ إضافة سيريال</button>
      <button type="button" id="removeBtn" class="btn btn-danger">➖ حذف سيريال</button>
    </div>

    <div id="serialsBox">
      <div class="form-group">
        <label>1</label>
        <input type="text" class="zerial-input" placeholder="اكتب السيريال هنا" maxlength="20" autocomplete="off">
        <p class="issue-date"></p>
      </div>
    </div>

    <div id="customerDetails">
      <div>👤 الاسم: <input type="text" id="name" readonly></div>
      <div>📞 الهاتف: <input type="text" id="phone" readonly></div>
      <div>📍 المحافظة: <input type="text" id="state" readonly></div>
      <div>🏙️ المدينة: <input type="text" id="city" readonly></div>
    </div>

    <div class="maint-info" id="maintInfo">
      الرسالة تتضمن:
      <ul>
        <li>🔗 رابط تسجيل بلاغ صيانة (مع السيريال لو تم إدخاله)</li>
        <li>💬 رابط الحجز عبر الواتس أب</li>
      </ul>
    </div>
  </section>

  <section class="card">
    <h2>💌 معاينة الرسالة</h2>
    <textarea id="copyTextBox" readonly></textarea>
    <button type="button" id="copyButton" class="btn btn-success btn-block">📋 نسخ الرسالة</button>
  </section>
</main>

<footer>© Unionaire — Customer Service</footer>
<div class="signature">✨ Designed &amp; Created by Ali Adel</div>
<div class="toast" id="toast">✅ تم نسخ الرسالة</div>

<script>
(function () {
  var mode = "serial";
  var box = document.getElementById("serialsBox");
  var out = document.getElementById("copyTextBox");

  function inputs() { return box.querySelectorAll(".zerial-input"); }

  function normalize(v) {
    var ar = "٠١٢٣٤٥٦٧٨٩";
    return v.replace(/\s+/g, "").toUpperCase()
            .replace(/[\/,*"'#._]/g, "-")
            .replace(/[٠-٩]/g, function (d) { return ar.indexOf(d); });
  }

  function serialValues() {
    var list = [];
    inputs().forEach(function (i) { var s = i.value.trim(); if (s) list.push(s); });
    return list;
  }

  function buildSerialMessage() {
    var s = serialValues();
    var links = s.length
      ? s.map(function (x) { return "🔗 https://unionaire.com/ct/index.php?serial=" + x; }).join("\n")
      : "🔗 https://unionaire.com/ct/index.php?serial=";
    return "عميلنا العزيز 🌟\n" +
      "برجاء الضغط على اللينك واختيار إحدى خدماتنا ( تفعيل الضمان - طلب الصيانة - التركيبات ) وتسجيل البيانات 👇\n" +
      links + "\n" +
      "📌 استخدم هذا الرابط في كل مرة ترغب فيها بحجز نفس الجهاز، فهو مخصص لك لضمان الحجز السهل والمتكرر بدون الحاجة للاتصال بخدمة العملاء 🙏";
  }

  function buildMaintMessage() {
    var s = serialValues();
    var links = s.length
      ? s.map(function (x) { return "🔗 https://unionaire.com/ct/index.php?serial=" + x; }).join("\n")
      : "🔗 http://unionaire.com/ct/";
    return "عميل يونيون اير العزيز 🌟\n" +
      "يمكنكم الآن تسجيل بلاغ صيانة 🛠️ من خلال الرابط التالي:\n" +
      links + "\n" +
      "💬 ويمكنكم الحجز ايضا عن طريق الواتس أب من خلال الرابط التالي:\n" +
      "https://wa.me/message/TCLIMRXYFJP5H1\n" +
      "نحن في خدمتكم دائماً ❤️\nUnionaire";
  }

  function update() {
    out.value = (mode === "maint") ? buildMaintMessage() : buildSerialMessage();
  }

  function renumber() {
    inputs().forEach(function (inp, i) {
      inp.parentNode.querySelector("label").textContent = i + 1;
    });
    update();
  }

  /* tabs */
  document.querySelectorAll(".tab").forEach(function (t) {
    t.addEventListener("click", function () {
      mode = t.getAttribute("data-mode");
      document.querySelectorAll(".tab").forEach(function (x) { x.classList.remove("active"); });
      t.classList.add("active");
      document.getElementById("maintInfo").style.display = (mode === "maint") ? "block" : "none";
      update();
    });
  });

  /* add / remove */
  document.getElementById("addBtn").addEventListener("click", function () {
    var d = document.createElement("div");
    d.className = "form-group";
    d.innerHTML = '<label></label><input type="text" class="zerial-input" placeholder="اكتب السيريال هنا" maxlength="20" autocomplete="off"><p class="issue-date"></p>';
    box.appendChild(d);
    renumber();
    d.querySelector("input").focus();
  });
  document.getElementById("removeBtn").addEventListener("click", function () {
    var groups = box.querySelectorAll(".form-group");
    if (groups.length > 0) {
      box.removeChild(groups[groups.length - 1]);
      if (groups.length === 1) { document.getElementById("customerDetails").style.display = "none"; }
      renumber();
    }
  });

  /* typing */
  var timers = [];
  box.addEventListener("input", function (e) {
    var el = e.target;
    if (!el.classList.contains("zerial-input")) return;
    var pos = el.selectionStart;
    var clean = normalize(el.value);
    if (clean !== el.value) { el.value = clean; }
    update();                                   // message updates instantly

    var dateEl = el.parentNode.querySelector(".issue-date");
    var idx = Array.prototype.indexOf.call(inputs(), el);
    clearTimeout(timers[idx]);
    dateEl.textContent = "";
    if (!clean) { if (idx === 0) document.getElementById("customerDetails").style.display = "none"; return; }

    timers[idx] = setTimeout(function () {
      dateEl.textContent = "...Loading";
      fetch("https://www.unionaire-tech.com/get_last_date?a_serial=" + encodeURIComponent(clean))
        .then(function (r) { return r.json(); })
        .then(function (d) { dateEl.textContent = d.issue_date || ""; })
        .catch(function () { dateEl.textContent = ""; });

      if (idx === 0) {
        fetch("https://www.unionaire-tech.com/get_customer_data_from_serial?serial_name=" + encodeURIComponent(clean))
          .then(function (r) { return r.json(); })
          .then(function (d) {
            var box2 = document.getElementById("customerDetails");
            if (d && d.data) {
              document.getElementById("name").value = d.data.name || "";
              document.getElementById("phone").value = d.data.main_mobile_number || "";
              document.getElementById("state").value = d.data.state_name || "";
              document.getElementById("city").value = d.data.city_name || "";
              box2.style.display = "block";
            } else { box2.style.display = "none"; }
          })
          .catch(function () {});
      }
    }, 400);
  });

  /* copy */
  document.getElementById("copyButton").addEventListener("click", function () {
    update();
    var text = out.value;
    function done() {
      var t = document.getElementById("toast");
      t.classList.add("show");
      setTimeout(function () { t.classList.remove("show"); }, 1800);
    }
    function fallback() { out.removeAttribute("readonly"); out.select(); document.execCommand("copy"); out.setAttribute("readonly", ""); done(); }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done).catch(fallback);
    } else { fallback(); }
  });

  update();
})();
</script>
</body>
</html>
