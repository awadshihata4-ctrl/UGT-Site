// ================== PARSE ==================
let data = raw.trim().split("\n").map((line, i)=>{
    let parts = line.split("\t");
    return {
        _i: i,
        type: parts[0],
        gov: parts[1],
        area: parts[2],
        address: parts[3],
        phone: parts[4],
        name: parts[5],
        odoo: parts[6]
    };
});

// ================== FILTERS ==================
function refreshFilters(){
    let govSel = document.getElementById("filterGov");
    let typeSel = document.getElementById("filterType");

    govSel.innerHTML = `<option value="">كل المحافظات</option>`;
    typeSel.innerHTML = `<option value="">كل الأنواع</option>`;

    let govs = [...new Set(data.map(d=>d.gov))];
    let types = [...new Set(data.map(d=>d.type))];

    govs.forEach(g=>{
        govSel.innerHTML += `<option value="${g}">${g}</option>`;
    });

    types.forEach(t=>{
        typeSel.innerHTML += `<option value="${t}">${t}</option>`;
    });
}

// ================== RENDER ==================
function render(){
    let gov = document.getElementById("filterGov").value;
    let type = document.getElementById("filterType").value;

    let filtered = data.filter(d=>{
        return (gov=="" || d.gov==gov) && (type=="" || d.type==type);
    });

    let tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";

    filtered.forEach((d)=>{

        let row = `
        <tr>
            <td>${d.type}</td>
            <td>${d.gov}</td>
            <td>${d.area}</td>
            <td>${d.address}</td>
            <td>${d.phone}</td>
            <td>${d.name}</td>
            <td>
                <button class="action-btn copy" onclick="copyRow(${d._i})">نسخ</button>
                <button class="action-btn delete" onclick="deleteRow(${d._i})">حذف</button>
            </td>
        </tr>
        `;
        tbody.innerHTML += row;
    });
}

// ================== COPY ==================
function copyRow(i){
    let d = data.find(x=>x._i==i);
    let text = `${d.gov}\t${d.area}\t${d.address}\t${d.phone}\t${d.name}`;
    navigator.clipboard.writeText(text);
    alert("تم النسخ");
}

// ================== DELETE ==================
function deleteRow(i){
    let pass = prompt("ادخل الباسورد:");
    if(pass=="2811"){
        data = data.filter(x=>x._i!=i);
        render();
        refreshFilters();
    }else{
        alert("باسورد خطأ");
    }
}

// ================== ADD ==================
function addCenter(){
    let pass = prompt("ادخل الباسورد:");
    if(pass!="2811"){
        alert("باسورد خطأ");
        return;
    }

    let type = prompt("نوع المنتج");
    let gov = prompt("المحافظة");
    let area = prompt("المنطقة");
    let address = prompt("العنوان");
    let phone = prompt("التليفون");
    let name = prompt("اسم المركز");
    let odoo = type + "_" + name;

    data.push({
        _i: data.length ? Math.max(...data.map(x=>x._i))+1 : 0,
        type,gov,area,address,phone,name,odoo
    });

    render();
    refreshFilters();
}

// ================== EVENTS ==================
document.getElementById("filterGov").onchange = render;
document.getElementById("filterType").onchange = render;

refreshFilters();
render();

</script>
